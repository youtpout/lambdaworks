[package]
name = "lambdaworks-gpu"
description = "Modular math library for cryptography - GPU implementation"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
thiserror = "1.0.38"

# Metal dependencies (macOS only)
metal = { version = "0.29", optional = true }
objc = { version = "0.2", optional = true }

[dev-dependencies]
ark-ec = { version = "0.5.0", features = ["std"] }
ark-ff = { version = "0.5.0", features = ["std", "parallel", "asm"] }
proptest = "1.1.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
criterion = { version = "0.5.1", default-features = false }
lambdaworks-math = { path = "../math" }
mina-curves = { git = "https://github.com/o1-labs/proof-systems", tag = "0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"

[build-dependencies]
walkdir = { version = "2.3.3", optional = true }

[features]
cuda = ["dep:walkdir"]
metal = ["dep:metal", "dep:objc", "dep:walkdir"]
# ROCm/HIP backend for AMD GPUs.
# Requires ROCm ≥ 5.0 installed (libamdhip64 + libhiprtc on the link path).
rocm = []

# Some features activate compilation of code which isn't
# supported in all machines (e.g. metal, cuda), so we won't
# use `--all-features` in any case, instead every feature
# that should compile in all cases will require to be added
# as default. If you don't want to compile with all of these
# use `--no-default-features`.
default = []

# The bench conditionally includes Metal and/or ROCm sections via cfg(feature).
# Activate at least one GPU backend to run it:
#   cargo bench --features metal   (Apple)
#   cargo bench --features rocm    (AMD)
[[bench]]
name = "pippenger_msm"
harness = false

[[bench]]
name = "o1js_msm"
harness = false
